{% extends "base.html" %}

{% block content %}

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8f9ff);
    padding: 40px;
    color: #333;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
}

h1 {
    font-size: 32px;
    margin-bottom: 5px;
    color: #2c2c54;
}

p.subtitle {
    color: #666;
    margin-bottom: 30px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

label {
    font-weight: 600;
    color: #444;
}

input, textarea, select {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    font-size: 14px;
    background: #fafafa;
    width: 100%;
}

input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #6c63ff;
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    background: white;
}

.button-group {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}

button[type="submit"] {
    flex: 1;
    background: linear-gradient(135deg, #6c63ff, #5a54e8);
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.cancel-btn {
    flex: 1;
    background: #e2e8f0;
    color: #334155;
    text-align: center;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    text-decoration: none;
}

.cancel-btn:hover {
    background: #cbd5e1;
    color: #1e293b;
}
</style>

<div class="container">
    <h1>Edit Competition Details</h1>
    <p class="subtitle">Modify the details for <strong>{{ comp.name }}</strong></p>

    <form method="POST" action="/edit_competition/{{ comp.id }}">
        
        <div>
            <label for="name">Competition Name</label>
            <input type="text" id="name" name="name" value="{{ comp.name }}" required>
        </div>
        
        <div>
            <label for="type">Type / Category</label>
            <input type="text" id="type" name="type" value="{{ comp.type }}" required>
        </div>

        <div>
            <label for="competition_date">Competition Date</label>
            <input type="date" id="competition_date" name="competition_date" value="{{ comp.competition_date }}" required>
        </div>
        
        <div>
            <label for="venue">Venue</label>
            <input type="text" id="venue" name="venue" value="{{ comp.venue }}" required>
        </div>
        
        <div>
            <label for="description">Description</label>
            <textarea id="description" name="description" required rows="4">{{ comp.description }}</textarea>
        </div>

        <div class="button-group">
            <a href="/admin" class="cancel-btn">Cancel</a>
            <button type="submit">Save Changes</button>
        </div>
    </form>
</div>

{% endblock %}
